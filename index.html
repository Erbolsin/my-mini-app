<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram Mini App - Fast Food & Online Shop</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              accent: '#38bdf8'
            }
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full flex flex-col justify-between overflow-x-hidden select-none bg-slate-950 text-slate-100 font-sans antialiased">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-sky-500/10 flex items-center justify-center text-sky-400 font-bold text-lg">
        🍔
      </div>
      <div>
        <h1 class="text-base font-bold leading-tight">Fast Shop</h1>
        <p class="text-xs text-slate-400">Tez va mazali yetkazib berish</p>
      </div>
    </div>
    <div id="cart-badge" class="hidden">
      <button onclick="openCartModal()" class="relative p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sky-400 transition-colors">
        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        <span id="cart-count" class="absolute -top-1 -right-1 bg-sky-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center border-2 border-slate-950">0</span>
      </button>
    </div>
  </header>

  <!-- Main Product Grid -->
  <main class="flex-1 max-w-2xl w-full mx-auto p-4 pb-24">
    <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Mahsulotlar</h2>
    <div id="products-grid" class="grid grid-cols-2 gap-3">
      <!-- Products dynamically inserted here -->
    </div>
  </main>

  <!-- Bottom Cart Bar -->
  <div id="bottom-cart-bar" class="fixed bottom-0 left-0 right-0 p-4 bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 transform translate-y-full transition-transform duration-300 z-40">
    <div class="max-w-2xl mx-auto flex items-center justify-between gap-4">
      <div>
        <p class="text-xs text-slate-400">Jami summa:</p>
        <p id="bottom-cart-total" class="text-lg font-bold text-sky-400">$0.00</p>
      </div>
      <button onclick="openCartModal()" class="flex-1 bg-sky-500 hover:bg-sky-600 active:scale-[0.98] text-white font-semibold py-3 px-6 rounded-xl shadow-lg shadow-sky-500/20 flex items-center justify-center space-x-2 transition-all">
        <span>Savatni ko'rish</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- Cart Modal -->
  <div id="cart-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex flex-col justify-end sm:justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border-t sm:border border-slate-800 rounded-t-2xl sm:rounded-2xl max-w-lg w-full mx-auto max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <h3 class="font-bold text-lg flex items-center gap-2">
          <i data-lucide="shopping-cart" class="w-5 h-5 text-sky-400"></i>
          Sizning savatingiz
        </h3>
        <button onclick="closeCartModal()" class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3 divide-y divide-slate-800/50">
        <!-- Cart items inserted here -->
      </div>

      <div class="p-4 border-t border-slate-800 bg-slate-900/50 space-y-3">
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-400">Jami:</span>
          <span id="modal-cart-total" class="text-lg font-bold text-sky-400">$0.00</span>
        </div>
        <button onclick="openCheckoutModal()" class="w-full bg-sky-500 hover:bg-sky-600 active:scale-[0.98] text-white font-semibold py-3 rounded-xl shadow-lg shadow-sky-500/20 transition-all">
          Buyurtmani rasmiylashtirish
        </button>
      </div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkout-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex flex-col justify-end sm:justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border-t sm:border border-slate-800 rounded-t-2xl sm:rounded-2xl max-w-lg w-full mx-auto max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <h3 class="font-bold text-lg flex items-center gap-2">
          <i data-lucide="clipboard-check" class="w-5 h-5 text-sky-400"></i>
          Ma'lumotlarni kiriting
        </h3>
        <button onclick="closeCheckoutModal()" class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="checkout-form" onsubmit="submitOrder(event)" class="p-4 overflow-y-auto space-y-4 text-sm">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Yetkazib berish manzili</label>
          <input type="text" id="delivery-address" required placeholder="Toshkent sh., Yunusobod t., 4-mavze" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-sky-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Telefon raqam</label>
          <input type="tel" id="customer-phone" required placeholder="+998 90 123 45 67" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-sky-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">To'lov turi</label>
          <div class="grid grid-cols-2 gap-2 mt-1">
            <label class="flex items-center space-x-2 border border-slate-700 bg-slate-800 p-2.5 rounded-xl cursor-pointer hover:border-sky-500">
              <input type="radio" name="payment" value="Cash" checked class="text-sky-500 focus:ring-0">
              <span class="text-xs font-medium">Naqd pulli</span>
            </label>
            <label class="flex items-center space-x-2 border border-slate-700 bg-slate-800 p-2.5 rounded-xl cursor-pointer hover:border-sky-500">
              <input type="radio" name="payment" value="Card" class="text-sky-500 focus:ring-0">
              <span class="text-xs font-medium">Karta orqali</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Izoh (ixtiyoriy)</label>
          <textarea id="order-note" rows="2" placeholder="Podyezd kodi, mo'ljal va h.k..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:border-sky-500"></textarea>
        </div>

        <button type="submit" class="w-full bg-sky-500 hover:bg-sky-600 active:scale-[0.98] text-white font-semibold py-3 rounded-xl shadow-lg shadow-sky-500/20 transition-all">
          Buyurtmani tasdiqlash
        </button>
      </form>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    const PRODUCTS = [
      { id: 1, title: 'Cheeseburger Combo', price: 6.50, emoji: '🍔', desc: 'Juicy beef, melted cheddar & fries' },
      { id: 2, title: 'Pepperoni Pizza', price: 12.00, emoji: '🍕', desc: 'Crispy crust with double pepperoni' },
      { id: 3, title: 'Crispy Chicken Wings', price: 7.99, emoji: '🍗', desc: '6 pcs spicy wings with dip' },
      { id: 4, title: 'Classic Club Sandwich', price: 5.50, emoji: '🥪', desc: 'Triple decker with turkey & bacon' },
      { id: 5, title: 'French Fries XXL', price: 3.00, emoji: '🍟', desc: 'Golden salty crunchy fries' },
      { id: 6, title: 'Cold Coca-Cola 0.5L', price: 1.50, emoji: '🥤', desc: 'Refreshing original taste' }
    ];

    let cart = {};

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function triggerHaptic(style = 'light') {
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred(style);
      }
    }

    function renderProducts() {
      const container = document.getElementById('products-grid');
      container.innerHTML = PRODUCTS.map(p => {
        const qty = cart[p.id] || 0;
        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col justify-between hover:border-slate-700 transition-all">
            <div>
              <div class="text-4xl text-center py-3 bg-slate-950/50 rounded-xl mb-2">${p.emoji}</div>
              <h3 class="font-bold text-sm line-clamp-1">${p.title}</h3>
              <p class="text-[11px] text-slate-400 line-clamp-2 mt-0.5">${p.desc}</p>
            </div>
            <div class="mt-3 flex items-center justify-between">
              <span class="font-bold text-sky-400 text-sm">$${p.price.toFixed(2)}</span>
              ${qty > 0 ? `
                <div class="flex items-center space-x-2 bg-slate-800 rounded-lg p-1">
                  <button onclick="updateQty(${p.id}, -1)" class="w-6 h-6 rounded-md bg-slate-700 flex items-center justify-center font-bold text-xs hover:bg-slate-600">-</button>
                  <span class="text-xs font-bold w-4 text-center">${qty}</span>
                  <button onclick="updateQty(${p.id}, 1)" class="w-6 h-6 rounded-md bg-sky-500 text-white flex items-center justify-center font-bold text-xs hover:bg-sky-400">+</button>
                </div>
              ` : `
                <button onclick="updateQty(${p.id}, 1)" class="bg-sky-500 hover:bg-sky-400 text-white px-3 py-1.5 rounded-lg font-semibold text-xs transition-colors">
                  <span>Qo'shish</span>
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function updateQty(id, change) {
      triggerHaptic('light');
      cart[id] = (cart[id] || 0) + change;
      if (cart[id] <= 0) delete cart[id];
      renderProducts();
      updateCartUI();
    }

    function getCartMetrics() {
      let totalCount = 0;
      let totalPrice = 0;
      Object.keys(cart).forEach(id => {
        const product = PRODUCTS.find(p => p.id === parseInt(id));
        if (product) {
          totalCount += cart[id];
          totalPrice += product.price * cart[id];
        }
      });
      return { totalCount, totalPrice };
    }

    function updateCartUI() {
      const { totalCount, totalPrice } = getCartMetrics();
      const badge = document.getElementById('cart-badge');
      const countEl = document.getElementById('cart-count');
      const bottomBar = document.getElementById('bottom-cart-bar');
      const bottomTotal = document.getElementById('bottom-cart-total');
      const modalTotal = document.getElementById('modal-cart-total');

      countEl.innerText = totalCount;
      bottomTotal.innerText = `$${totalPrice.toFixed(2)}`;
      modalTotal.innerText = `$${totalPrice.toFixed(2)}`;

      if (totalCount > 0) {
        badge.classList.remove('hidden');
        bottomBar.classList.remove('translate-y-full');
      } else {
        badge.classList.add('hidden');
        bottomBar.classList.add('translate-y-full');
        closeCartModal();
      }
    }

    function openCartModal() {
      triggerHaptic('medium');
      renderCartItems();
      document.getElementById('cart-modal').classList.remove('hidden');
    }

    function closeCartModal() {
      document.getElementById('cart-modal').classList.add('hidden');
    }

    function openCheckoutModal() {
      closeCartModal();
      triggerHaptic('medium');
      document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }

    function renderCartItems() {
      const container = document.getElementById('cart-items');
      const items = Object.keys(cart).map(id => {
        const product = PRODUCTS.find(p => p.id === parseInt(id));
        return { ...product, qty: cart[id] };
      });

      if (items.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-500 py-8 text-sm">Savat bo'sh</p>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="flex items-center justify-between pt-3">
          <div class="flex items-center space-x-3">
            <span class="text-2xl">${item.emoji}</span>
            <div>
              <p class="font-semibold text-sm">${item.title}</p>
              <p class="text-xs text-slate-400">$${item.price.toFixed(2)} x ${item.qty}</p>
            </div>
          </div>
          <div class="flex items-center space-x-2 bg-slate-800 rounded-lg p-1">
            <button onclick="updateQty(${item.id}, -1); renderCartItems();" class="w-6 h-6 rounded bg-slate-700 font-bold text-xs">-</button>
            <span class="text-xs font-bold w-4 text-center">${item.qty}</span>
            <button onclick="updateQty(${item.id}, 1); renderCartItems();" class="w-6 h-6 rounded bg-sky-500 text-white font-bold text-xs">+</button>
          </div>
        </div>
      `).join('');
    }

    // AYNAN SHU FUNKSIYA QOTISHNI (FREEZE) YO'QOTADI
    function submitOrder(event) {
      if (event) event.preventDefault();

      triggerHaptic('heavy');

      const address = document.getElementById('delivery-address')?.value || 'Ko\'rsatilmadi';
      const phone = document.getElementById('customer-phone')?.value || 'Ko\'rsatilmadi';
      const payment = document.querySelector('input[name="payment"]:checked')?.value || 'Cash';
      const note = document.getElementById('order-note')?.value || '';

      const { totalPrice } = getCartMetrics();

      const orderPayload = {
        items: Object.keys(cart).map(id => {
          const product = PRODUCTS.find(p => p.id === parseInt(id));
          return {
            id: id,
            title: product ? product.title : 'Mahsulot',
            quantity: cart[id],
            price: product ? product.price : 0
          };
        }),
        address: address,
        phone: phone,
        paymentMethod: payment,
        note: note,
        totalPrice: totalPrice
      };

      if (window.Telegram && window.Telegram.WebApp) {
        const tgApp = window.Telegram.WebApp;
        tgApp.ready();

        try {
          // Ma'lumotni Telegram botga yuborish
          tgApp.sendData(JSON.stringify(orderPayload));
          
          // Telegram Mini App oynasini avtomashina yopish (Freeze-ning oldini oladi)
          tgApp.close();
        } catch (err) {
          alert("Xatolik: " + err.message);
        }
      } else {
        alert("Buyurtma yuborildi (Brauzer testi):\n" + JSON.stringify(orderPayload, null, 2));
      }
    }

    renderProducts();
    lucide.createIcons();
  </script>
</body>
</html>
