<!DOCTYPE html>
<html lang="uz" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fast Food & Premium Delivery</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              500: '#f97316', // Premium Orange Accent
              600: '#ea580c',
              700: '#c2410c'
            }
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom Scrollbar for smooth horizontal scrolling */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full flex flex-col justify-between overflow-x-hidden select-none bg-slate-950 text-slate-100 font-sans antialiased">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-orange-500 to-amber-400 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-orange-500/20">
        ⚡
      </div>
      <div>
        <h1 class="text-base font-bold leading-tight flex items-center gap-1.5">
          FastDelivery
          <span class="text-[10px] bg-orange-500/20 text-orange-400 font-semibold px-1.5 py-0.5 rounded-md border border-orange-500/30">PRO</span>
        </h1>
        <p class="text-xs text-slate-400 flex items-center gap-1">
          <i data-lucide="clock" class="w-3 h-3 text-slate-500"></i> 20-30 daqiqa • Bepul yetkazish*
        </p>
      </div>
    </div>

    <!-- Cart Badge Top Right -->
    <button onclick="openCartModal()" id="cart-badge-btn" class="relative p-2.5 rounded-2xl bg-slate-800/80 border border-slate-700/50 hover:bg-slate-800 text-orange-400 transition-all active:scale-95">
      <i data-lucide="shopping-bag" class="w-5 h-5"></i>
      <span id="cart-count" class="absolute -top-1.5 -right-1.5 bg-orange-500 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-950 scale-0 transition-transform duration-200">0</span>
    </button>
  </header>

  <!-- Search & Category Filter Section -->
  <section class="p-4 pb-2 space-y-3 bg-slate-950">
    <!-- Search Bar -->
    <div class="relative">
      <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"></i>
      <input type="text" id="search-input" oninput="handleSearch()" placeholder="Taom yoki ichimlik qidirish..." class="w-full bg-slate-900 border border-slate-800/80 rounded-2xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-orange-500/50 transition-colors">
    </div>

    <!-- Categories horizontal scroll -->
    <div id="categories-container" class="flex space-x-2 overflow-x-auto no-scrollbar py-1">
      <!-- Injected via JS -->
    </div>
  </section>

  <!-- Main Product Grid -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-2 pb-28">
    <div id="products-grid" class="grid grid-cols-2 gap-3">
      <!-- Dynamic Products -->
    </div>
    <div id="empty-state" class="hidden text-center py-12 space-y-2">
      <i data-lucide="search-x" class="w-10 h-10 mx-auto text-slate-600"></i>
      <p class="text-sm font-medium text-slate-400">Afsuski, hech narsa topilmadi</p>
    </div>
  </main>

  <!-- Floating Bottom Bar -->
  <div id="bottom-cart-bar" class="fixed bottom-0 left-0 right-0 p-4 bg-slate-900/95 backdrop-blur-xl border-t border-slate-800/80 transform translate-y-full transition-transform duration-300 z-40 shadow-2xl">
    <div class="max-w-2xl mx-auto flex items-center justify-between gap-4">
      <div>
        <p class="text-[11px] text-slate-400 uppercase tracking-wider font-medium">Jami mahsulotlar</p>
        <p id="bottom-cart-total" class="text-xl font-black text-orange-400">$0.00</p>
      </div>
      <button onclick="openCartModal()" class="flex-1 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 active:scale-[0.98] text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-orange-500/25 flex items-center justify-center space-x-2 transition-all">
        <span>Savatni ko'rish</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- Cart Modal -->
  <div id="cart-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex flex-col justify-end sm:justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border-t sm:border border-slate-800/80 rounded-t-3xl sm:rounded-3xl max-w-lg w-full mx-auto max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/50">
        <h3 class="font-bold text-lg flex items-center gap-2">
          <i data-lucide="shopping-bag" class="w-5 h-5 text-orange-400"></i>
          Sizning buyurtmangiz
        </h3>
        <button onclick="closeCartModal()" class="p-1.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3 divide-y divide-slate-800/50">
        <!-- Cart Items -->
      </div>

      <div class="p-4 border-t border-slate-800/80 bg-slate-900/80 space-y-3">
        <div class="space-y-1 text-xs text-slate-400">
          <div class="flex justify-between">
            <span>Mahsulotlar:</span>
            <span id="modal-subtotal" class="font-semibold text-slate-200">$0.00</span>
          </div>
          <div class="flex justify-between">
            <span>Yetkazib berish:</span>
            <span id="modal-delivery" class="font-semibold text-slate-200">$1.50</span>
          </div>
          <div class="flex justify-between text-sm font-bold text-slate-100 pt-2 border-t border-slate-800">
            <span>Jami to'lov:</span>
            <span id="modal-cart-total" class="text-base font-black text-orange-400">$0.00</span>
          </div>
        </div>
        <button onclick="openCheckoutModal()" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 active:scale-[0.98] text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-orange-500/25 transition-all">
          Rasmiylashtirishga o'tish
        </button>
      </div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkout-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex flex-col justify-end sm:justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border-t sm:border border-slate-800/80 rounded-t-3xl sm:rounded-3xl max-w-lg w-full mx-auto max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <h3 class="font-bold text-lg flex items-center gap-2">
          <i data-lucide="map-pin" class="w-5 h-5 text-orange-400"></i>
          Yetkazib berish ma'lumotlari
        </h3>
        <button onclick="closeCheckoutModal()" class="p-1.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="checkout-form" onsubmit="submitOrder(event)" class="p-4 overflow-y-auto space-y-4 text-sm">
        <div>
          <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Manzil</label>
          <input type="text" id="delivery-address" required placeholder="Toshkent sh., Yunusobod t., 4-mavze, 12-uy" class="w-full bg-slate-800/80 border border-slate-700/70 rounded-2xl px-3.5 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 transition-colors">
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Telefon raqam</label>
          <input type="tel" id="customer-phone" required placeholder="+998 90 123 45 67" class="w-full bg-slate-800/80 border border-slate-700/70 rounded-2xl px-3.5 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 transition-colors">
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">To'lov turi</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="flex flex-col items-center justify-center border border-slate-700/70 bg-slate-800/50 p-2.5 rounded-2xl cursor-pointer hover:border-orange-500 has-[:checked]:border-orange-500 has-[:checked]:bg-orange-500/10 transition-all">
              <input type="radio" name="payment" value="Cash" checked class="hidden">
              <span class="text-base mb-0.5">💵</span>
              <span class="text-xs font-semibold">Naqd</span>
            </label>
            <label class="flex flex-col items-center justify-center border border-slate-700/70 bg-slate-800/50 p-2.5 rounded-2xl cursor-pointer hover:border-orange-500 has-[:checked]:border-orange-500 has-[:checked]:bg-orange-500/10 transition-all">
              <input type="radio" name="payment" value="Click/Payme" class="hidden">
              <span class="text-base mb-0.5">💳</span>
              <span class="text-xs font-semibold">Click / Payme</span>
            </label>
            <label class="flex flex-col items-center justify-center border border-slate-700/70 bg-slate-800/50 p-2.5 rounded-2xl cursor-pointer hover:border-orange-500 has-[:checked]:border-orange-500 has-[:checked]:bg-orange-500/10 transition-all">
              <input type="radio" name="payment" value="Terminal" class="hidden">
              <span class="text-base mb-0.5">📱</span>
              <span class="text-xs font-semibold">Terminal</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Izoh (kuryer uchun)</label>
          <textarea id="order-note" rows="2" placeholder="Domofon kodi, qavat, mo'ljal..." class="w-full bg-slate-800/80 border border-slate-700/70 rounded-2xl px-3.5 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 transition-colors"></textarea>
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 active:scale-[0.98] text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-orange-500/25 transition-all">
          Buyurtmani tasdiqlash
        </button>
      </form>
    </div>
  </div>

  <!-- JS App Core -->
  <script>
    const CATEGORIES = [
      { id: 'all', name: 'Barchasi', icon: '🍽️' },
      { id: 'burgers', name: 'Burgers', icon: '🍔' },
      { id: 'pizza', name: 'Pizze', icon: '🍕' },
      { id: 'chicken', name: 'Tovuq', icon: '🍗' },
      { id: 'drinks', name: 'Ichimliklar', icon: '🥤' }
    ];

    const PRODUCTS = [
      { id: 1, category: 'burgers', title: 'Double Black Cheeseburger', price: 7.50, emoji: '🍔', desc: 'Ikkita suvli kotlet, cheddar pishlog\'i, maxsus sous' },
      { id: 2, category: 'burgers', title: 'Classic Beef Burger', price: 5.50, emoji: '🍔', desc: 'Klassik mol go\'shti va barra sabzavotlar' },
      { id: 3, category: 'pizza', title: 'Pepperoni Supreme', price: 11.90, emoji: '🍕', desc: 'Mo'l pepperoni va cho'ziluvchan mosarella' },
      { id: 4, category: 'pizza', title: 'Four Cheese Special', price: 10.50, emoji: '🧀', desc: '4 xil premium pishloq uyg'unligi' },
      { id: 5, category: 'chicken', title: 'Crispy Wings (8 dona)', price: 8.00, emoji: '🍗', desc: 'Qarsillama va achchiq tovuq qanotchalari' },
      { id: 6, category: 'chicken', title: 'Nuggets & French Fries', price: 6.00, emoji: '🍟', desc: 'Nuggetslar kartoshka fri bilan' },
      { id: 7, category: 'drinks', title: 'Coca-Cola Zero 0.5L', price: 1.50, emoji: '🥤', desc: 'Muzdek tetiklashtiruvchi ichimlik' },
      { id: 8, category: 'drinks', title: 'Fresh Orange Juice', price: 3.00, emoji: '🧃', desc: 'Tabiiy yangi siqilgan apelsin sharbati' }
    ];

    let cart = {};
    let selectedCategory = 'all';
    let searchQuery = '';

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#0f172a');
    }

    function triggerHaptic(style = 'light') {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred(style);
    }

    function renderCategories() {
      const container = document.getElementById('categories-container');
      container.innerHTML = CATEGORIES.map(c => `
        <button onclick="setCategory('${c.id}')" class="flex items-center space-x-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${selectedCategory === c.id ? 'bg-orange-500 text-white shadow-md shadow-orange-500/20' : 'bg-slate-900 border border-slate-800 text-slate-400 hover:text-white'}">
          <span>${c.icon}</span>
          <span>${c.name}</span>
        </button>
      `).join('');
    }

    function setCategory(id) {
      triggerHaptic('light');
      selectedCategory = id;
      renderCategories();
      renderProducts();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      renderProducts();
    }

    function renderProducts() {
      const container = document.getElementById('products-grid');
      const emptyState = document.getElementById('empty-state');

      const filtered = PRODUCTS.filter(p => {
        const matchesCategory = selectedCategory === 'all' || p.category === selectedCategory;
        const matchesSearch = p.title.toLowerCase().includes(searchQuery) || p.desc.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      container.innerHTML = filtered.map(p => {
        const qty = cart[p.id] || 0;
        return `
          <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-3 flex flex-col justify-between hover:border-slate-700/80 transition-all">
            <div>
              <div class="text-4xl text-center py-3 bg-slate-950/60 rounded-xl mb-2.5 select-none">${p.emoji}</div>
              <h3 class="font-bold text-sm leading-tight text-slate-100 line-clamp-1">${p.title}</h3>
              <p class="text-[11px] text-slate-400 line-clamp-2 mt-1 leading-relaxed">${p.desc}</p>
            </div>
            <div class="mt-3.5 flex items-center justify-between pt-2 border-t border-slate-800/50">
              <span class="font-black text-orange-400 text-sm">$${p.price.toFixed(2)}</span>
              ${qty > 0 ? `
                <div class="flex items-center space-x-1.5 bg-slate-800 rounded-xl p-1 border border-slate-700/50">
                  <button onclick="updateQty(${p.id}, -1)" class="w-6 h-6 rounded-lg bg-slate-700 flex items-center justify-center font-bold text-xs hover:bg-slate-600 text-slate-200 active:scale-90 transition-transform">-</button>
                  <span class="text-xs font-black w-4 text-center text-orange-400">${qty}</span>
                  <button onclick="updateQty(${p.id}, 1)" class="w-6 h-6 rounded-lg bg-orange-500 text-white flex items-center justify-center font-bold text-xs hover:bg-orange-400 active:scale-90 transition-transform">+</button>
                </div>
              ` : `
                <button onclick="updateQty(${p.id}, 1)" class="bg-orange-500/10 hover:bg-orange-500 text-orange-400 hover:text-white border border-orange-500/30 px-3 py-1.5 rounded-xl font-bold text-xs transition-all active:scale-95">
                  + Qo'shish
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function updateQty(id, change) {
      triggerHaptic('light');
      cart[id] = (cart[id] || 0) + change;
      if (cart[id] <= 0) delete cart[id];
      renderProducts();
      updateCartUI();
    }

    function getCartMetrics() {
      let subtotal = 0;
      let totalCount = 0;
      Object.keys(cart).forEach(id => {
        const p = PRODUCTS.find(prod => prod.id === parseInt(id));
        if (p) {
          subtotal += p.price * cart[id];
          totalCount += cart[id];
        }
      });
      const delivery = subtotal >= 15 || subtotal === 0 ? 0 : 1.50;
      return { subtotal, delivery, totalPrice: subtotal + delivery, totalCount };
    }

    function updateCartUI() {
      const { subtotal, delivery, totalPrice, totalCount } = getCartMetrics();
      const badgeBtn = document.getElementById('cart-badge-btn');
      const countEl = document.getElementById('cart-count');
      const bottomBar = document.getElementById('bottom-cart-bar');

      countEl.innerText = totalCount;
      document.getElementById('bottom-cart-total').innerText = `$${totalPrice.toFixed(2)}`;
      document.getElementById('modal-subtotal').innerText = `$${subtotal.toFixed(2)}`;
      document.getElementById('modal-delivery').innerText = delivery === 0 ? 'Bepul' : `$${delivery.toFixed(2)}`;
      document.getElementById('modal-cart-total').innerText = `$${totalPrice.toFixed(2)}`;

      if (totalCount > 0) {
        countEl.classList.remove('scale-0');
        bottomBar.classList.remove('translate-y-full');
      } else {
        countEl.classList.add('scale-0');
        bottomBar.classList.add('translate-y-full');
        closeCartModal();
      }
    }

    function openCartModal() {
      if (getCartMetrics().totalCount === 0) return;
      triggerHaptic('medium');
      renderCartItems();
      document.getElementById('cart-modal').classList.remove('hidden');
    }

    function closeCartModal() {
      document.getElementById('cart-modal').classList.add('hidden');
    }

    function openCheckoutModal() {
      closeCartModal();
      triggerHaptic('medium');
      document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }

    function renderCartItems() {
      const container = document.getElementById('cart-items');
      const items = Object.keys(cart).map(id => ({
        ...PRODUCTS.find(p => p.id === parseInt(id)),
        qty: cart[id]
      }));

      container.innerHTML = items.map(item => `
        <div class="flex items-center justify-between pt-3">
          <div class="flex items-center space-x-3">
            <span class="text-2xl">${item.emoji}</span>
            <div>
              <p class="font-bold text-sm text-slate-100">${item.title}</p>
              <p class="text-xs text-slate-400">$${item.price.toFixed(2)} × ${item.qty}</p>
            </div>
          </div>
          <div class="flex items-center space-x-1.5 bg-slate-800 rounded-xl p-1 border border-slate-700/50">
            <button onclick="updateQty(${item.id}, -1); renderCartItems();" class="w-6 h-6 rounded-lg bg-slate-700 font-bold text-xs">-</button>
            <span class="text-xs font-black w-4 text-center text-orange-400">${item.qty}</span>
            <button onclick="updateQty(${item.id}, 1); renderCartItems();" class="w-6 h-6 rounded-lg bg-orange-500 text-white font-bold text-xs">+</button>
          </div>
        </div>
      `).join('');
    }

    function submitOrder(event) {
      if (event) event.preventDefault();
      triggerHaptic('heavy');

      const address = document.getElementById('delivery-address')?.value || 'Ko\'rsatilmadi';
      const phone = document.getElementById('customer-phone')?.value || 'Ko\'rsatilmadi';
      const payment = document.querySelector('input[name="payment"]:checked')?.value || 'Cash';
      const note = document.getElementById('order-note')?.value || '';

      const { subtotal, delivery, totalPrice } = getCartMetrics();

      const orderPayload = {
        items: Object.keys(cart).map(id => {
          const p = PRODUCTS.find(prod => prod.id === parseInt(id));
          return {
            id: id,
            title: p ? p.title : 'Mahsulot',
            quantity: cart[id],
            price: p ? p.price : 0
          };
        }),
        address: address,
        phone: phone,
        paymentMethod: payment,
        note: note,
        subtotal: subtotal,
        deliveryFee: delivery,
        totalPrice: totalPrice
      };

      if (window.Telegram?.WebApp) {
        const tgApp = window.Telegram.WebApp;
        tgApp.ready();
        try {
          tgApp.sendData(JSON.stringify(orderPayload));
          tgApp.close();
        } catch (err) {
          alert("Xatolik: " + err.message);
        }
      } else {
        alert("Demo Order Submitted:\n" + JSON.stringify(orderPayload, null, 2));
      }
    }

    renderCategories();
    renderProducts();
    lucide.createIcons();
  </script>
</body>
</html>
